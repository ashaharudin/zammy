#cloud-config
# ⛔ ARCHIVAL — NOT IN USE. This bootstrapped a staging VM on OCI Always Free
# Ampere A1 (arm64), Ubuntu 24.04, for a target abandoned 2026-08-21: no such VM
# was ever created, because the capacity never appeared. Do not run it against a
# new target without rereading it — the package set and the arm64 assumption are
# both OCI-shaped. Kept because the bootstrap DISCIPLINE below is not: no
# secrets in user_data, deploy by digest, a 0600 env template an operator fills
# in once. See docs/DEPLOYMENT-OCI.md §7 (archival).
#
# Pass this as the Instance's user_data at creation. It runs ONCE, on first boot,
# and leaves a box that can run the stack but is not yet running it: no image has
# been chosen and no secrets exist. `zammy-deploy <image@sha256:...>` is what
# actually starts things, and CI hands it the digest.
#
# ── Deliberately contains no secrets ─────────────────────────────────────────
# user_data is readable from the instance metadata service by any process on the
# box, and via the API by anyone with instance-read permission. It is not a
# secret store. So this file writes /opt/zammy/.env as a 0600 template with
# placeholders, and an operator fills it in once over SSH. The eventual upgrade
# is the same one §4 defers for production — instance principal reads from OCI
# Vault at boot — and it replaces the manual step without changing anything else.
#
# ── What must exist outside this file ────────────────────────────────────────
#   1. An NSG allowing the load balancer subnet → this instance on 3000, and
#      nothing else inbound but SSH. This file adds the host-side rule; the NSG
#      is Terraform's job (§3) and neither substitutes for the other.
#   2. `docker login` against OCIR, once, as root — the api image is private.
#      zammy-deploy fails with a readable message until that is done.

package_update: true
package_upgrade: true

write_files:
  # Written before Docker is installed so the daemon picks it up on first start.
  # Unbounded json-file logs are the classic way to fill a 47 GB boot volume and
  # take the stack down for reasons that look like anything but disk.
  - path: /etc/docker/daemon.json
    permissions: "0644"
    content: |
      {
        "log-driver": "json-file",
        "log-opts": { "max-size": "10m", "max-file": "3" }
      }

  - path: /opt/zammy/compose.yaml
    permissions: "0644"
    content: |
      # Staging stack. NOT the production topology: OCI Database with PostgreSQL
      # and OCI Cache are not in the Always Free tier, so both are containers on
      # this VM. The api image is byte-identical to production's — only these
      # environment variables differ, which is the discipline the whole plan
      # rests on (DEPLOYMENT-OCI §1).
      name: zammy

      services:
        postgres:
          image: postgres:17-alpine
          restart: unless-stopped
          environment:
            POSTGRES_USER: zammy
            POSTGRES_DB: zammy
            # `:?` so a missing secret fails at `compose up` with a named
            # variable, rather than as an auth error three layers down.
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in /opt/zammy/.env}
          volumes:
            - postgres-data:/var/lib/postgresql/data
          # No published ports. Nothing outside this VM talks to Postgres, and
          # the private data subnet it will live in one day has the same shape.
          healthcheck:
            test: ["CMD-SHELL", "pg_isready -U zammy -d zammy"]
            interval: 5s
            timeout: 3s
            retries: 10
          deploy:
            resources:
              limits:
                memory: 2G

        redis:
          # volatile-lru for the same reason as the dev compose file: cache keys
          # carry TTLs and may be evicted freely, but the ingest queue's keys do
          # not, and evicting one mid-job drops deferred work instead of retrying
          # it (ARCHITECTURE 9.1, 11).
          image: redis:7-alpine
          restart: unless-stopped
          command: ["redis-server", "--maxmemory", "512mb", "--maxmemory-policy", "volatile-lru"]
          healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 10
          deploy:
            resources:
              limits:
                memory: 640M

        api:
          # Digest-pinned, written by zammy-deploy. Never a tag: a tag is a
          # mutable pointer and "which image is staging running" must have an
          # answer that survives the next push.
          image: ${ZAMMY_API_IMAGE:?run zammy-deploy <image@sha256:...> instead of compose directly}
          restart: unless-stopped
          environment:
            NODE_ENV: production
            PORT: "3000"
            LOG_LEVEL: ${LOG_LEVEL:-info}
            DATABASE_URL: postgres://zammy:${POSTGRES_PASSWORD:?}@postgres:5432/zammy
            # Plaintext redis:// on the compose network — staging has no TLS
            # endpoint. Production's rediss:// path is verified but NOT exercised
            # here (§2.4); staging being green says nothing about it.
            REDIS_URL: redis://redis:6379
            # live by default, so staging exercises the real upstream — the
            # Cloudflare UA rule, the x-ratelimit-* headers, and the date_range
            # ceiling are all things fixtures replay rather than enforce.
            #
            # The cost is quota: this key's 1000 calls/day are shared with whatever
            # else uses it. Either give staging its own Currents key, or cap its
            # share with CURRENTS_DAILY_CALL_LIMIT (see .env.template).
            #
            # Left as `:-` rather than required, because CURRENTS_MODE=fixture must
            # stay a working escape hatch and no key is needed then. live without a
            # key is caught by zammy-deploy before it pulls, and by @zammy/config
            # at boot after that.
            CURRENTS_MODE: ${CURRENTS_MODE:-live}
            CURRENTS_API_KEY: ${CURRENTS_API_KEY:-}
            CURRENTS_DAILY_CALL_LIMIT: ${CURRENTS_DAILY_CALL_LIMIT:-1000}
            INTERACTIVE_RESERVE: ${INTERACTIVE_RESERVE:-250}
            # Must be non-empty and should identify the deployment — Cloudflare
            # 403s default library User-Agents (PROBE-FINDINGS 2).
            CURRENTS_USER_AGENT: ${CURRENTS_USER_AGENT:?set CURRENTS_USER_AGENT in /opt/zammy/.env}
            GEMINI_API_KEY: ${GEMINI_API_KEY:-}
            CORS_ORIGIN: ${CORS_ORIGIN:?set CORS_ORIGIN in /opt/zammy/.env}
            # 0 until the load balancer actually fronts this box, then 1. The count
            # must match what is really in front: over-counting trusts a
            # client-supplied X-Forwarded-For hop and voids the per-IP rate limit,
            # while under-counting only keys every request on the LB's address —
            # one shared bucket, which is the safer way to be wrong.
            TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-0}
            FIXTURES_DIR: ./fixtures
          ports:
            # Bound on all interfaces because the load balancer reaches this
            # instance by its private IP. Access is constrained by the NSG and by
            # the DOCKER-USER rule this cloud-init installs — not by binding.
            - "3000:3000"
          depends_on:
            postgres:
              condition: service_healthy
            redis:
              condition: service_healthy
          # Matches the dev compose file and the ≥15s window §4 asks for. The app
          # drains on SIGTERM as PID 1; no init shim.
          stop_grace_period: 15s
          deploy:
            resources:
              limits:
                memory: 2G

      volumes:
        postgres-data:

  # Template only — no real values. Filled in once over SSH.
  - path: /opt/zammy/.env.template
    permissions: "0600"
    owner: root:root
    content: |
      # Copy to /opt/zammy/.env (chmod 600) and fill in. Compose reads .env from
      # this directory automatically; every name here is consumed by compose.yaml.

      # Written by zammy-deploy — leave empty, it is not edited by hand.
      ZAMMY_API_IMAGE=

      # Set to 1 once the load balancer fronts this instance; leave 0 while the
      # api is reached directly. Must match the topology exactly — see compose.yaml.
      TRUSTED_PROXY_HOPS=0

      # Any long random string; it never leaves this VM. e.g. openssl rand -hex 24
      POSTGRES_PASSWORD=

      # Identify the deployment. Non-empty is enforced at boot.
      CURRENTS_USER_AGENT="zammy-staging/0.1 (+https://github.com/ashaharudin/zammy)"

      # Same-origin once the LB path-routes /api/* and the web container (§4);
      # until then, the staging hostname the browser actually uses.
      CORS_ORIGIN=https://staging.example.com

      # live is the default: staging talks to the real upstream. A key is then
      # MANDATORY — @zammy/config refuses to boot with live and no key, on purpose.
      # Set CURRENTS_MODE=fixture to run offline against the image's fixtures,
      # which needs no key.
      CURRENTS_MODE=live
      CURRENTS_API_KEY=

      # Optional guard on how much of the daily quota staging may spend. The free
      # tier allows 1000 calls/day PER KEY, so if staging shares a key with
      # anything else, it can starve it. Prefer a separate Currents key for
      # staging; failing that, uncomment both lines together — INTERACTIVE_RESERVE
      # must stay strictly below the limit or background ingestion can never run,
      # and the process refuses to boot if it isn't.
      # CURRENTS_DAILY_CALL_LIMIT=200
      # INTERACTIVE_RESERVE=50

      # Optional. Absent means storyline labels fall back to the bigram
      # extractor, which renders fine — nothing blocks on it (ADR-0011).
      GEMINI_API_KEY=

      LOG_LEVEL=info

  # Boot-time start that tolerates a not-yet-configured box. A first boot with no
  # .env is the normal case, not a failure, and should not leave a red unit. A
  # half-finished deploy is the opposite case and deliberately IS one: the pinned
  # image was never verified, and quietly starting it would be worse than a red
  # unit.
  - path: /opt/zammy/bin/zammy-up
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      cd /opt/zammy
      if [[ ! -f .env ]]; then
        echo "zammy: /opt/zammy/.env absent — nothing to start yet."
        echo "zammy: copy .env.template to .env, fill it in, then run zammy-deploy."
        exit 0
      fi
      if ! grep -qE '^ZAMMY_API_IMAGE=.+' .env; then
        echo "zammy: no image pinned yet — run: zammy-deploy <image@sha256:...>"
        exit 0
      fi
      # zammy-deploy writes "in-progress <image>" before it migrates and "ok
      # <image>" only after /readyz reports ready. Anything else means the last
      # deploy died in the middle: .env names what was ATTEMPTED, not what was
      # verified, and an unattended reboot must not promote it.
      if [[ -f deploy.state ]] && [[ "$(awk '{print $1; exit}' deploy.state)" != "ok" ]]; then
        echo "zammy: last deploy did not complete: $(cat deploy.state)" >&2
        echo "zammy: refusing to start the unverified image. Re-run zammy-deploy" >&2
        echo "zammy: (same digest to retry, or a known-good one to roll back)." >&2
        exit 1
      fi
      exec docker compose up -d --remove-orphans

  # Migrations as a discrete step, never on boot (ARCHITECTURE 4, §5). Runs the
  # SAME digest the api runs, with the command overridden — so "what migrated"
  # and "what runs" cannot drift.
  - path: /opt/zammy/bin/zammy-migrate
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      cd /opt/zammy
      # --wait, not a bare `up -d`: `up -d` returns when the container has
      # STARTED, not when Postgres is accepting connections, and --no-deps below
      # skips the depends_on health gate that would otherwise cover it. Without
      # this the first migration on a cold box dies with ECONNREFUSED on 5432.
      docker compose up -d --wait postgres
      # --no-deps: the api's own dependency conditions would pull Redis up too,
      # and a migration has no business needing the queue.
      exec docker compose run --rm --no-deps api \
        node node_modules/@zammy/storage/dist/migrate-cli.js

  # The nightly chores (ARCHITECTURE 9.1). They used to be a BullMQ job scheduler
  # inside the api process; the clock now lives out here, and the api only has to
  # be running for the passes to reach a database, not to make them happen.
  #
  # Same image, same environment block, command overridden — the discipline
  # zammy-migrate follows, for the same reason: a chore that read a different
  # DATABASE_URL or a different APP_TIMEZONE than the api would bucket days
  # differently, and nothing in the rows would say which ran.
  - path: /opt/zammy/bin/zammy-chores
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      set -euo pipefail

      # Argument check before anything touches the filesystem, so a typo reports
      # the usage rather than whatever failed first.
      pass="${1:-}"
      case "$pass" in
        retention|storylines) ;;
        *) echo "usage: zammy-chores <retention|storylines>" >&2; exit 64 ;;
      esac

      cd /opt/zammy

      # An unconfigured or half-deployed box is not a failed chore. A timer that
      # goes red on a fresh instance trains an operator to ignore the timer, and
      # the state these three checks describe is one a deploy fixes — not one a
      # nightly pass should report. Same posture, and same three checks, as
      # zammy-up.
      if [[ ! -f .env ]]; then
        echo "zammy-chores: no /opt/zammy/.env — nothing to run against yet."
        exit 0
      fi
      if ! grep -qE '^ZAMMY_API_IMAGE=.+' .env; then
        echo "zammy-chores: no image pinned yet — run zammy-deploy first."
        exit 0
      fi
      if [[ -f deploy.state ]] && [[ "$(awk '{print $1; exit}' deploy.state)" != "ok" ]]; then
        echo "zammy-chores: last deploy did not complete ($(cat deploy.state));" >&2
        echo "zammy-chores: refusing to run chores against an unverified image." >&2
        exit 0
      fi

      # --wait so a cold box cannot ECONNREFUSED on 5432, and --no-deps so the
      # runner does not drag Redis up: these passes touch Postgres and Gemini
      # only, never the cache or the queue.
      docker compose up -d --wait postgres
      exec docker compose run --rm --no-deps api node dist/chores-cli.js "$pass"

  - path: /opt/zammy/bin/zammy-deploy
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      # Deploy a digest: pull → migrate → roll → verify readiness.
      # Usage: zammy-deploy <registry>/<ns>/<repo>@sha256:<hex>
      set -euo pipefail

      image="${1:-}"
      if [[ -z "$image" ]]; then
        echo "usage: zammy-deploy <image@sha256:...>" >&2
        exit 64
      fi
      if [[ ! "$image" =~ @sha256:[0-9a-f]{64}$ ]]; then
        echo "refusing: deploy by digest, not by tag (got '$image')." >&2
        echo "CI prints the digest in its job summary." >&2
        exit 64
      fi

      cd /opt/zammy
      if [[ ! -f .env ]]; then
        echo "no /opt/zammy/.env — copy .env.template, fill it in, retry." >&2
        exit 78
      fi

      # live mode with no key is a boot refusal, not a warning (@zammy/config
      # rejects the combination rather than 401-ing on the first search). Catching
      # it here costs one line and replaces a 30s readiness timeout plus a restart
      # loop with a sentence. An absent CURRENTS_MODE means live, matching the
      # default in compose.yaml — so absent-and-keyless must fail too.
      # Reads a value the way compose reads .env: last assignment wins, a quoted
      # value ends at its closing quote, and an unquoted value ends at the first
      # whitespace-then-# inline comment — so this gate and compose cannot
      # disagree about the same line.
      read_env() {
        local raw
        raw="$(sed -n "s/^[[:space:]]*$1=//p" .env | tail -1 | tr -d '\r')"
        if [[ "$raw" =~ ^\"([^\"]*)\" ]]; then
          printf '%s' "${BASH_REMATCH[1]}"
        elif [[ "$raw" =~ ^\'([^\']*)\' ]]; then
          printf '%s' "${BASH_REMATCH[1]}"
        else
          raw="${raw%%[[:space:]]#*}"
          printf '%s' "${raw%"${raw##*[![:space:]]}"}"
        fi
      }
      mode="$(read_env CURRENTS_MODE)"
      if [[ "${mode:-live}" == "live" && -z "$(read_env CURRENTS_API_KEY)" ]]; then
        echo "CURRENTS_MODE is live (the default) but CURRENTS_API_KEY is empty." >&2
        echo "The api refuses to boot in that state, by design." >&2
        echo "Set the key in /opt/zammy/.env, or set CURRENTS_MODE=fixture to" >&2
        echo "run offline against the image's fixtures." >&2
        exit 78
      fi

      if ! docker pull "$image"; then
        echo >&2
        echo "pull failed. If this is an auth error, the OCIR repo is private:" >&2
        echo "  sudo docker login <registry-domain>" >&2
        echo "  username: <namespace>/<user>   password: an OCIR auth token" >&2
        exit 69
      fi

      # Record the digest before rolling, so a failed roll leaves an .env that
      # says what was attempted rather than what used to run. deploy.state is
      # what separates attempted from verified: it stays "in-progress" until
      # /readyz says ready, and zammy-up refuses to auto-start while it does —
      # otherwise an unattended reboot after a failed migration would boot the
      # unvetted image against an un-migrated database.
      if grep -q '^ZAMMY_API_IMAGE=' .env; then
        sed -i "s|^ZAMMY_API_IMAGE=.*|ZAMMY_API_IMAGE=${image}|" .env
      else
        printf 'ZAMMY_API_IMAGE=%s\n' "$image" >> .env
      fi
      printf 'in-progress %s\n' "$image" > deploy.state

      # --wait blocks until both report healthy, so the migration below cannot
      # race Postgres's startup. It also fails loudly if either never gets there,
      # which is the right moment to stop — before migrating or rolling.
      echo "==> data stores"
      docker compose up -d --wait postgres redis

      echo "==> migrations (discrete step, same digest)"
      /opt/zammy/bin/zammy-migrate

      echo "==> rolling api"
      docker compose up -d --no-deps api

      echo "==> waiting for readiness"
      # Asserts status == "ready", not merely HTTP 200. /readyz returns 200 with
      # status "degraded" when only Redis is down (health.ts) — by design, since
      # Redis is survivable — which means a 200 alone would let a broken queue
      # deploy silently. This is the check DEPLOYMENT-OCI §2.4 asks for.
      for attempt in $(seq 1 30); do
        body="$(curl -fsS --max-time 5 http://127.0.0.1:3000/readyz 2>/dev/null || true)"
        if [[ -n "$body" ]] && printf '%s' "$body" | python3 -c '
      import json, sys
      d = json.load(sys.stdin)
      sys.exit(0 if d.get("status") == "ready" else 1)
      '; then
          printf 'ok %s\n' "$image" > deploy.state
          echo "ready after ${attempt}s: $body"
          exit 0
        fi
        sleep 1
      done

      echo >&2
      echo "NOT ready after 30s. Last /readyz body:" >&2
      echo "${body:-<no response>}" >&2
      echo "Logs: docker compose -f /opt/zammy/compose.yaml logs --tail=50 api" >&2
      exit 1

  # ── Host firewall ───────────────────────────────────────────────────────────
  # Two things make this fiddlier than it looks.
  #
  # 1. DOCKER-USER, not INPUT. Published container ports are DNAT'd and traverse
  #    FORWARD, so an INPUT rule reads correctly, tests clean against the host,
  #    and filters nothing that reaches a container. Oracle's Ubuntu images ship
  #    a default-REJECT INPUT chain, which makes that mistake look like it works.
  #
  # 2. Rules must be INSERTED above DOCKER-USER's default `-j RETURN`, never
  #    appended. Docker creates the chain with that single RETURN rule; anything
  #    appended after it is unreachable, so a `-A ... -j DROP` silently filters
  #    nothing at all. Hence the explicit positions below.
  #
  # Applied by a unit ordered after docker.service rather than persisted with
  # netfilter-persistent: Docker rebuilds its chains on every start, and
  # restoring a saved copy of them races that rebuild. Re-applying our own two
  # rules afterwards is deterministic. The script rebuilds rather than appends —
  # every rule for the api port is deleted before the pair is inserted — so
  # re-running it after a CIDR change replaces the old ACCEPT instead of
  # leaving that range allowed until the next reboot.
  #
  # This is defence in depth behind the NSG, not a replacement for it.
  - path: /opt/zammy/bin/zammy-firewall
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      set -euo pipefail

      # /etc/zammy-firewall.conf is the single source of truth: systemd passes
      # it via EnvironmentFile, and sourcing it here makes a manual run see the
      # same values instead of silently falling back to the defaults below,
      # which only cover a missing file.
      [[ -f /etc/zammy-firewall.conf ]] && . /etc/zammy-firewall.conf
      CIDR="${ZAMMY_LB_CIDR:-10.0.0.0/16}"
      PORT="${ZAMMY_API_PORT:-3000}"

      # The chain only exists once dockerd has built it.
      if ! iptables -n -L DOCKER-USER >/dev/null 2>&1; then
        echo "DOCKER-USER chain absent — is docker running?" >&2
        exit 1
      fi

      # Rebuild, don't accumulate: delete every rule for this port first, so a
      # changed CIDR replaces the old ACCEPT instead of leaving that range
      # allowed until the next reboot. (A changed PORT still leaves the old
      # port's pair behind — the conf file says how to remove it.)
      iptables -S DOCKER-USER \
        | sed -n "s/^-A DOCKER-USER \(.* --dport $PORT .*\)/\1/p" \
        | while read -r rule; do
            # shellcheck disable=SC2086 — reusing iptables' own tokenization
            iptables -D DOCKER-USER $rule
          done

      # Insert at explicit positions so both land above the trailing RETURN,
      # ACCEPT before DROP.
      iptables -I DOCKER-USER 1 -p tcp --dport "$PORT" -s "$CIDR" -j ACCEPT
      iptables -I DOCKER-USER 2 -p tcp --dport "$PORT" -j DROP

      echo "DOCKER-USER now:"
      iptables -S DOCKER-USER

  - path: /etc/systemd/system/zammy-firewall.service
    permissions: "0644"
    content: |
      [Unit]
      Description=zammy DOCKER-USER rules for the api port
      # After docker, because the chain does not exist until dockerd builds it,
      # and dockerd rebuilds it on every start.
      Requires=docker.service
      After=docker.service
      Before=zammy.service

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      EnvironmentFile=-/etc/zammy-firewall.conf
      ExecStart=/opt/zammy/bin/zammy-firewall

      [Install]
      WantedBy=multi-user.target

  - path: /etc/zammy-firewall.conf
    permissions: "0644"
    content: |
      # The CIDR allowed to reach the api port — set this to your VCN's range.
      # After editing: sudo systemctl restart zammy-firewall — it rebuilds both
      # rules, so the old CIDR stops being allowed immediately. Changing
      # ZAMMY_API_PORT is the one edit that leaves the OLD port's pair in
      # place; remove it with `iptables -D DOCKER-USER ...` or reboot.
      ZAMMY_LB_CIDR=10.0.0.0/16
      ZAMMY_API_PORT=3000

  - path: /etc/systemd/system/zammy.service
    permissions: "0644"
    content: |
      [Unit]
      Description=zammy staging stack (docker compose)
      Requires=docker.service
      After=docker.service network-online.target
      Wants=network-online.target

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      WorkingDirectory=/opt/zammy
      ExecStart=/opt/zammy/bin/zammy-up
      ExecStop=/usr/bin/docker compose down
      TimeoutStartSec=0

      [Install]
      WantedBy=multi-user.target

  # ── The nightly chore schedule ──────────────────────────────────────────────
  # Two things about these timers are load-bearing.
  #
  # 1. `UTC` is written explicitly. OnCalendar defaults to the HOST's local time,
  #    while the schedule being reproduced (BullMQ's `0 3 * * *` / `0 4 * * *`)
  #    ran in the api container's UTC, and the passes bucket by calendar day
  #    using APP_TIMEZONE, which also defaults to UTC. A box in a non-UTC zone
  #    would silently shift the prune cutoff and the day buckets relative to each
  #    other. Pinning UTC here keeps all three agreeing.
  #
  # 2. `Persistent=true`. A box that was off at 03:00 runs the missed pass on next
  #    boot rather than skipping the night. This is deliberately the behaviour the
  #    BullMQ scheduler had — a due job sat in Redis's delayed set and was
  #    promoted whenever a worker came back — so moving the clock out here does
  #    not quietly lose the catch-up. It runs late; it does not vanish.
  #
  # systemd will not re-enter a unit that is still running, so a pass that
  # overruns into the next night is skipped rather than doubled. The runner's
  # advisory lock is the backstop for the case systemd cannot see: a second
  # scheduler, somewhere else, pointed at the same database.
  - path: /etc/systemd/system/zammy-chore-retention.service
    permissions: "0644"
    content: |
      [Unit]
      Description=zammy retention report and trailing-corpus prune
      Requires=docker.service
      After=docker.service

      [Service]
      Type=oneshot
      WorkingDirectory=/opt/zammy
      ExecStart=/opt/zammy/bin/zammy-chores retention
      # The pass walks the archive; it is not a 90-second job on a busy night.
      TimeoutStartSec=30min

  - path: /etc/systemd/system/zammy-chore-retention.timer
    permissions: "0644"
    content: |
      [Unit]
      Description=zammy retention chore, 03:00 UTC

      [Timer]
      OnCalendar=*-*-* 03:00:00 UTC
      Persistent=true

      [Install]
      WantedBy=timers.target

  - path: /etc/systemd/system/zammy-chore-storylines.service
    permissions: "0644"
    content: |
      [Unit]
      Description=zammy storyline lifecycle pass (dormancy, sweeps, labels, merges)
      Requires=docker.service
      After=docker.service

      [Service]
      Type=oneshot
      WorkingDirectory=/opt/zammy
      ExecStart=/opt/zammy/bin/zammy-chores storylines
      # Generous on purpose: the label pass is PACED, not slow — it spaces model
      # calls at GEMINI_MAX_RPM (15/min by default) and a night with hundreds of
      # drifted storylines legitimately takes hours. A tight timeout here would
      # SIGTERM the pass mid-run every busy night, which reads as a broken chore
      # rather than as the ceiling doing its job. Lower `--max-labels` to bound
      # the work; do not bound it with this.
      TimeoutStartSec=6h

  - path: /etc/systemd/system/zammy-chore-storylines.timer
    permissions: "0644"
    content: |
      [Unit]
      Description=zammy storyline lifecycle pass, 04:00 UTC

      [Timer]
      OnCalendar=*-*-* 04:00:00 UTC
      Persistent=true

      [Install]
      WantedBy=timers.target

  # The free tier has no managed backups, so staging gets the cheap version. Not
  # PITR and not a substitute for §4's production requirement — but it means a
  # staging database is worth having data in. bash with pipefail, because under
  # plain sh a failed pg_dump still exits 0 through gzip: seven days of
  # valid-looking empty archives, and the rotation below has deleted every real
  # backup — discovered at restore time.
  - path: /etc/cron.daily/zammy-pgdump
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      cd /opt/zammy 2>/dev/null || exit 0
      [[ -f .env ]] || exit 0
      mkdir -p /var/backups/zammy
      out="/var/backups/zammy/zammy-$(date +%F).sql.gz"
      tmp="${out}.tmp"
      trap 'rm -f "$tmp"' EXIT
      docker compose exec -T postgres pg_dump -U zammy zammy | gzip > "$tmp"
      # pg_dump writes its own trailer last; a dump without one is truncated,
      # whatever the exit codes said.
      if ! zcat "$tmp" | tail -n 5 | grep -q 'PostgreSQL database dump complete'; then
        echo "zammy-pgdump: dump has no completion trailer — discarding" >&2
        exit 1
      fi
      mv "$tmp" "$out"
      # Rotate only after this run produced a verified backup, so a stretch of
      # failures can never age the last good ones out.
      find /var/backups/zammy -name 'zammy-*.sql.gz' -mtime +7 -delete

  - path: /opt/zammy/README
    permissions: "0644"
    content: |
      zammy staging — provisioned by deploy/staging/cloud-init.yaml

      First-run, once:
        sudo cp /opt/zammy/.env.template /opt/zammy/.env
        sudo chmod 600 /opt/zammy/.env
        sudo vi /opt/zammy/.env          # POSTGRES_PASSWORD, CORS_ORIGIN, UA,
                                         # and CURRENTS_API_KEY — required,
                                         # because CURRENTS_MODE defaults to live
        sudo docker login <ocir-domain>  # the api image is private

      If your VCN CIDR is not 10.0.0.0/16:
        sudo vi /etc/zammy-firewall.conf
        sudo systemctl restart zammy-firewall   # rebuilds both rules; prints the chain

      Check the firewall actually took effect (the DROP must sit ABOVE RETURN):
        sudo iptables -S DOCKER-USER

      Every deploy (CI prints the digest in its job summary):
        sudo zammy-deploy <registry>/<ns>/zammy/api@sha256:<hex>

      Operating:
        docker compose -f /opt/zammy/compose.yaml ps
        docker compose -f /opt/zammy/compose.yaml logs -f api
        curl -s localhost:3000/readyz | python3 -m json.tool
        sudo systemctl status zammy
        cat /opt/zammy/deploy.state    # "ok <digest>" after a verified deploy;
                                       # anything else and zammy-up refuses to
                                       # auto-start until a deploy completes

      Nightly chores (retention 03:00 UTC, storylines 04:00 UTC). These are the
      app's clock: the api does NOT schedule them, so if these timers are not
      running, the passes never happen and nothing will say so.
        systemctl list-timers 'zammy-chore-*'      # next/last fire — check this first
        journalctl -u zammy-chore-storylines -n 50 # what the last pass reported
        sudo zammy-chores retention                # run one now, by hand
        sudo zammy-chores storylines               # ditto (paced; can take hours)

      A pass logs "another run holds this pass's lock — skipping" when one is
      already in flight. Seen once, that is the overlap guard working; seen every
      night, a run is stuck — check journalctl for the one that never finished.

      What staging does NOT prove: managed Postgres/Cache, private endpoints,
      PITR, rediss:// against a real TLS endpoint, or multi-instance rolling
      deploys. See docs/DEPLOYMENT-OCI.md §7.

runcmd:
  # ── Docker from Docker's own apt repo ──────────────────────────────────────
  # Not the distro package and not the snap: this box's only job is running
  # containers, and compose v2 as a daemon plugin is what the scripts assume.
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - |
    echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" \
      > /etc/apt/sources.list.d/docker.list
  - apt-get update
  - DEBIAN_FRONTEND=noninteractive apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin
  - systemctl enable --now docker

  - usermod -aG docker ubuntu
  - ln -sf /opt/zammy/bin/zammy-deploy /usr/local/bin/zammy-deploy
  - ln -sf /opt/zammy/bin/zammy-migrate /usr/local/bin/zammy-migrate
  - ln -sf /opt/zammy/bin/zammy-chores /usr/local/bin/zammy-chores

  # ── Host firewall ─────────────────────────────────────────────────────────
  # Applied by a systemd unit rather than inline, so it survives reboots without
  # netfilter-persistent — see the zammy-firewall files above for why.
  - systemctl enable --now zammy-firewall.service

  # Enabled, not started: there is no .env and no image yet. zammy-up is written
  # to no-op cleanly in that state, so the unit is green on a fresh box and the
  # first real start is the operator's deploy.
  - systemctl daemon-reload
  - systemctl enable zammy.service

  # The chore timers ARE started: they are the app's clock, and the scripts they
  # run no-op cleanly on an unconfigured box. Starting them now means the first
  # night after a deploy is covered without anyone remembering this step — which
  # matters more than usual, because nothing in the api will report their absence.
  - systemctl enable --now zammy-chore-retention.timer
  - systemctl enable --now zammy-chore-storylines.timer

final_message: |
  zammy staging bootstrapped in $UPTIME seconds.
  Next: fill /opt/zammy/.env, `docker login` to OCIR, then
  `sudo zammy-deploy <image@sha256:...>`. See /opt/zammy/README.
