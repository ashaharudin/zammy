<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Zammy — trace any story back to where it started</title>
    <meta
      name="description"
      content="Trace any story back to where it started. Zammy groups headlines from across the news into storylines, so you can follow how a story actually unfolded."
    />

    <!--
      The canonical is the HOME page on every route, and that is the point
      rather than an oversight.

      Every view this app has is a query parameter on `/` (`?q=`, `?storyline=`,
      `?lang=`) that renders nothing at all until JavaScript runs. A crawler
      that reaches `?q=iran` is looking at the same empty shell as `/`, so
      letting the parameter forms compete as separate URLs would split one
      page's standing across an unbounded number of blank ones. Pointing them
      all at `/` consolidates that instead.

      It stops being right the moment a storyline has a route of its own and
      something server-renders it: a per-route canonical is part of THAT change,
      not something to leave behind here.
    -->
    <link rel="canonical" href="https://www.zammy.info/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Zammy" />
    <meta property="og:url" content="https://www.zammy.info/" />
    <meta property="og:title" content="Zammy — trace any story back to where it started" />
    <meta
      property="og:description"
      content="Headlines from across the news, grouped into storylines and ordered the way the story actually unfolded."
    />
    <!-- Absolute, because a share card is fetched by a crawler that has no page
         to resolve a relative path against. -->
    <meta property="og:image" content="https://www.zammy.info/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The zammy> wordmark beside a vertical timeline rail of four marks."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Zammy — trace any story back to where it started" />
    <meta
      name="twitter:description"
      content="Headlines from across the news, grouped into storylines and ordered the way the story actually unfolded."
    />
    <meta name="twitter:image" content="https://www.zammy.info/og.png" />

    <!-- Two, matching the light and dark `--bg` in index.css, so the browser
         chrome meets the page instead of framing it. The media queries alone
         are deliberate: `data-theme`, which ThemeProvider sets when a reader
         overrides the OS, cannot be expressed here — a `theme-color` reads the
         OS preference and nothing else. A reader on a dark OS who has chosen
         light gets dark chrome over a light page, which is the one combination
         this cannot fix from markup. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fafafa" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121212" />

    <!-- The .ico is first and carries an explicit `sizes`, which is what stops
         Chrome preferring it over the SVG; the SVG then wins wherever it is
         understood, and the .ico serves the surfaces that still only take one
         (Google's result favicons among them). -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!--
      JSON-LD, Tier 4 SEO's first piece (`docs/SEO.md`, "What comes next" 1):
      `WebSite` + `SearchAction`, so a search engine that already understands
      this markup can offer a search box for Zammy directly in a result,
      targeting the one search this app has — `?q=` (`apps/web/src/route.ts`).

      Static and hand-written, unlike `render-storyline.ts`'s per-storyline
      JSON-LD: every value here is a constant this file already owns (the
      site's own name and origin), so there is no upstream text to escape and
      no reason to build this with code that runs per request.

      The `@id` is not decorative. This file is also the TEMPLATE the storyline
      pages are rendered from, so every one of them carries this block plus its
      own `CollectionPage` — whose `isPartOf` points at this same id. Without
      it the two scripts describe the same site as two unrelated nodes; with
      it they are one. `render-storyline.ts`'s `WEBSITE_ID` is the other half,
      and `jsonld.test.ts` checks the two strings agree.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "@id": "https://www.zammy.info/#website",
        "name": "Zammy",
        "url": "https://www.zammy.info/",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://www.zammy.info/?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>

    <!--
      Google Analytics (GA4, G-T2Q1KDQ9QS).

      `config` fires one page_view on load and no more: this app never reloads,
      it pushes state (App.tsx). What covers the rest is GA4's own enhanced
      measurement — "page changes based on browser history events" — which is on
      by default and listens for exactly the pushState/replaceState calls
      App.tsx makes. If that setting is ever turned off in the property, SPA
      navigation stops being counted here and nothing in this file will say so.
    -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-T2Q1KDQ9QS"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-T2Q1KDQ9QS");
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!--
      The rail's live region: empty, and in the original markup rather than
      rendered by React, which is the whole point. See `RailAnnouncer` in
      apps/web/src/TimelinePage.tsx for why.

      It must stay empty: text here is text the reader never hears. It must also
      stay OUT of #root, which React empties on its first commit. Both, plus the
      attributes and the id, are checked by railAnnouncer.test.ts — which reads
      this file and shares the id with the code rather than retyping it.
    -->
    <p id="rail-status" class="sr-only" role="status" aria-live="polite"></p>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
