# CI — verify, then run the discrete migration step Vercel has no hook for.
#
# Deployment moved to Vercel + Supabase + Upstash (ADR-0015): `vercel build`
# builds straight from source (vercel.json's buildCommand is plain `pnpm
# build`), so there is no container image in the deploy path for this
# workflow to prove out. `apps/api/Dockerfile` still exists for local dev
# (`docker compose --profile app up --build`) but is no longer built here —
# it is exercised, if at all, by whoever runs Compose locally.
#
# ⚠️ arm64 is a leftover from an earlier, abandoned deploy target, kept
# because it is free of downsides rather than because it is still required:
# `ubuntu-24.04-arm` matches the x64 standard runner's spec (2 vCPU) on this
# private repo and is billed slightly cheaper per minute, so there is no QEMU
# cost and no reason to churn it on a guess.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# A superseded run on the same ref has nothing to tell us — on a PULL REQUEST.
# Main is different now that this workflow carries a migration (`migrate
# (production)`): cancelling a push-to-main run can kill `pnpm db:migrate`
# mid-DDL. That is survivable — the migrator holds `pg_advisory_lock` on a
# pinned connection, so a killed process drops the connection, releases the lock
# and rolls its transaction back — but the deploy that is racing it would then
# be running against a database one migration short, silently. Let main runs
# queue instead; there are few of them and each one is a schema change.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: verify (arm64)
    runs-on: ubuntu-24.04-arm

    # The api tests are integration tests, not unit tests: createTestHarness
    # CREATEs a real database per run and drives a real Redis (test-support.ts).
    # Both images are multi-arch, so they run natively alongside the runner.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: zammy
          POSTGRES_PASSWORD: zammy
          POSTGRES_DB: zammy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zammy -d zammy"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # Matches the defaults in test-support.ts; stated explicitly so a change
      # to either side is a visible conflict rather than a silent divergence.
      TEST_DATABASE_URL: postgres://zammy:zammy@localhost:5432/zammy
      TEST_REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v7

      # Reads the pinned version from the root package.json `packageManager`
      # field, so CI and the Dockerfile's corepack cannot drift apart.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Root `build` orders packages before apps, which `tsc -b` needs.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

  # ─── Migrations ────────────────────────────────────────────────────────────
  #
  # ADR-0003 requires migrations as a discrete step, never on boot, and Vercel
  # has no outbound post-deploy hook — so the deploy and the migration cannot be
  # made atomic (VERCEL-ALL-IN-SCOPE §6). This job is that discrete step. What
  # makes the missing atomicity survivable is expand/contract discipline, which
  # is a rule about the migrations themselves and not something a workflow file
  # can enforce: additive migrations land BEFORE the code that needs them,
  # destructive ones AFTER the code that stopped needing them.
  #
  # Gates on `verify`. A migration is the one thing in this repo that a
  # rollback cannot undo — Vercel's Instant Rollback rolls code back and leaves
  # the schema where it is — so it must not run off a commit whose tests never
  # passed.
  #
  # This job does not deploy — but something else does, and that is worth
  # stating precisely because it was not true when these jobs were written.
  # **The Vercel project IS git-linked.** A push to main produces a production
  # deployment on its own (it carries the `zammy-git-main-<scope>.vercel.app`
  # alias). So merging to main ships code, whether or not anyone runs deploy.sh.
  # Main is the only branch that deploys: PR branches used to get a preview too,
  # but the Preview environment's retirement left those previews with no env vars
  # and unable to serve traffic, so vercel.json's `git.deploymentEnabled` turned
  # automatic branch deploys off (2026-08-26). That setting takes minimatch
  # patterns and needs `**`, not `*`: a single star will not cross the `/` in
  # `claude/<branch>`, so `*` matches nothing here and goes silently inert.
  #
  # It cost this workflow a property worth knowing about: those previews were
  # the only PR-time exercise of `vercel.json`'s `functions` block, and the
  # steps below do not run `vercel build`. A function that stops bundling now
  # surfaces on the production deploy. See deploy/vercel/README.md.
  #
  # deploy/vercel/deploy.sh still exists and is still the way to deploy local or
  # uncommitted state: a CLI deploy from the repository itself lands BLOCKED,
  # because Vercel stamps it with the commit author rather than the account that
  # owns the project, which is why that script builds from a `.git`-excluded
  # copy. Deployments made through the git integration are attributed by the
  # integration and do not hit that.
  #
  # The ordering consequence for a migration-bearing merge: the git-linked
  # production deploy and this job start at roughly the same moment and neither
  # waits for the other, which is precisely the non-atomicity §6 describes.
  # Expand/contract is what makes that safe.
  #
  # There used to be a matching `migrate-preview` job here, migrating a second
  # free-tier Supabase project on pull requests. It's gone: Upstash only
  # supports one environment per project, and once the preview Redis database
  # was removed there (2026-08-26) a separate preview data plane no longer made
  # sense — see deploy/vercel/README.md and ADR-0015.

  migrate-production:
    name: migrate (production)
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm

    env:
      DATABASE_SESSION_URL: ${{ secrets.PRODUCTION_DATABASE_SESSION_URL }}
      DATABASE_SSL: verify-full
      DATABASE_CA_CERT: ${{ secrets.SUPABASE_CA_CERT }}

    steps:
      - uses: actions/checkout@v7

      - name: secrets are present
        run: |
          test -n "$DATABASE_SESSION_URL" || {
            echo "::error::PRODUCTION_DATABASE_SESSION_URL is not set. See deploy/vercel/provision-production.sh."
            exit 1
          }
          test -n "$DATABASE_CA_CERT" || {
            echo "::error::SUPABASE_CA_CERT is not set; DATABASE_SSL=verify-full needs it."
            exit 1
          }

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter "./packages/*" build

      # The CLI announces which of the two URLs it used, and prints one line per
      # migration. A run that says "Nothing to migrate" is the healthy majority
      # case — most merges carry no schema change.
      - run: pnpm db:migrate
