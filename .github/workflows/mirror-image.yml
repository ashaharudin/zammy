# Copies a public upstream image into OCIR.
#
# Why this exists: the private data subnet has no route to the internet
# (deploy/terraform/network.tf), so the Redis Container Instance that will live
# there reaches OCIR over the service gateway and cannot reach Docker Hub at all.
# Mirroring is therefore not a preference — it is the only way that container gets
# an image (DEPLOYMENT-OCI §3).
#
# Why a workflow rather than someone's laptop: pushing to OCIR needs OCI_USERNAME
# and OCI_AUTH_TOKEN, which already live here as repository secrets. Running it in
# CI means nobody handles a registry credential by hand, and re-running it after a
# version bump is one click rather than a remembered procedure.
name: Mirror image to OCIR

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Upstream image, digest-pinned. A tag alone would make this run unreproducible."
        required: true
        default: "redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2"
      repository:
        description: "OCIR repository under the prefix, e.g. redis"
        required: true
        default: "redis"
      tag:
        description: "Tag to publish in OCIR. The digest is what gets deployed; this is for humans."
        required: true
        default: "7-alpine"

jobs:
  mirror:
    name: mirror to OCIR
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: docker/setup-buildx-action@v4

      - name: Check tenancy variables
        env:
          OCI_REGISTRY: ${{ vars.OCI_REGISTRY }}
          OCI_NAMESPACE: ${{ vars.OCI_NAMESPACE }}
          OCI_REPO_PREFIX: ${{ vars.OCI_REPO_PREFIX }}
        run: |
          for name in OCI_REGISTRY OCI_NAMESPACE OCI_REPO_PREFIX; do
            if [[ -z "${!name}" ]]; then
              echo "::error::$name is not set. See DEPLOYMENT-OCI §2." >&2
              exit 1
            fi
          done

      # A tag-only source would mean this job copies something different every
      # time it runs, which defeats the point of mirroring for reproducibility.
      - name: Require a digest-pinned source
        env:
          SOURCE: ${{ inputs.source }}
        run: |
          if [[ "$SOURCE" != *"@sha256:"* ]]; then
            echo "::error::source must be digest-pinned (…@sha256:…), got '$SOURCE'" >&2
            exit 1
          fi

      - uses: docker/login-action@v4
        with:
          registry: ${{ vars.OCI_REGISTRY }}
          username: ${{ secrets.OCI_USERNAME }}
          password: ${{ secrets.OCI_AUTH_TOKEN }}

      # imagetools copies the whole manifest index, so the mirror keeps every
      # platform the upstream published rather than flattening to this runner's.
      # Manifest digests are content-addressed, so the copy should land on the
      # SAME digest — which the next step asserts rather than assumes.
      - name: Copy into OCIR
        id: copy
        env:
          SOURCE: ${{ inputs.source }}
          DEST: ${{ vars.OCI_REGISTRY }}/${{ vars.OCI_NAMESPACE }}/${{ vars.OCI_REPO_PREFIX }}/${{ inputs.repository }}:${{ inputs.tag }}
        run: |
          docker buildx imagetools create --tag "$DEST" "$SOURCE"
          echo "dest=$DEST" >> "$GITHUB_OUTPUT"

      - name: Verify the mirrored digest matches upstream
        env:
          SOURCE: ${{ inputs.source }}
          DEST: ${{ steps.copy.outputs.dest }}
        run: |
          upstream="${SOURCE##*@}"
          mirrored="$(docker buildx imagetools inspect "$DEST" --format '{{println .Manifest.Digest}}' | head -1)"
          echo "upstream: $upstream"
          echo "mirrored: $mirrored"
          if [[ "$upstream" != "$mirrored" ]]; then
            echo "::error::digest changed in transit — the mirror is not the image that was reviewed" >&2
            exit 1
          fi
          {
            echo "### Mirrored"
            echo
            echo '```'
            echo "${DEST%%:*}@${mirrored}"
            echo '```'
            echo
            echo "Deploy by that digest, never by \`${DEST##*/}\`."
          } >> "$GITHUB_STEP_SUMMARY"
